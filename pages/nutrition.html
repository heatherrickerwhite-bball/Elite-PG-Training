<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite PG Nutrition</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#1b5e20;
}

.meal-card{
    background:#fff;
    border-radius:12px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.meal-card h2{
    margin-top:0;
    color:#1b5e20;
}

.meal-card h3{
    margin-bottom:8px;
    color:#444;
}

label{
    display:block;
    padding:6px 0;
    font-size:16px;
}

input[type="checkbox"]{
    margin-right:10px;
}
</style>

</head>

<body>

<h1>🥗 Daily Nutrition</h1>

<!-- Breakfast -->

<section class="meal-card">

<h2>🍳 Breakfast</h2>

<h3>Main</h3>

<label><input type="checkbox">Cereal</label>
<label><input type="checkbox">Waffles</label>
<label><input type="checkbox">Bacon</label>
<label><input type="checkbox">Sausage</label>
<label><input type="checkbox">Protein Yogurt (Optional)</label>

<h3>Fruit</h3>

<label><input type="checkbox">Strawberries</label>
<label><input type="checkbox">Apple</label>
<label><input type="checkbox">Pineapple</label>
<label><input type="checkbox">Watermelon</label>

</section>

<!-- Morning Snack -->

<section class="meal-card">

<h2>🍎 Morning Snack</h2>

<label><input type="checkbox">Goldfish</label>
<label><input type="checkbox">Pretzels</label>
<label><input type="checkbox">Beef Jerky</label>
<label><input type="checkbox">Cheese Stick</label>
<label><input type="checkbox">Grapes</label>
<label><input type="checkbox">Strawberries</label>
<label><input type="checkbox">Apple</label>
<label><input type="checkbox">Pineapple</label>
<label><input type="checkbox">Watermelon</label>

</section>

<label><input type="checkbox">Crackers</label>

<h3>Sides</h3>

<label><input type="checkbox">Pretzels</label>

<h3>Fruit</h3>

<label><input type="checkbox">Apple</label>
<label><input type="checkbox">Pineapple</label>
<label><input type="checkbox">Watermelon</label>

<label><input type="checkbox">Goldfish</label>

</html>
